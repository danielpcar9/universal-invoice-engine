services:
  postgres:
    image: postgres:16-alpine
    container_name: universal-invoice-engine-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-universal_invoice_engine}
      POSTGRES_USER: ${POSTGRES_USER:-uie_app}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-uie_password}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-uie_app} -d ${POSTGRES_DB:-universal_invoice_engine}"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
