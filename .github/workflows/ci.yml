name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: uie_app
          POSTGRES_PASSWORD: uie_secret
          POSTGRES_DB: universal_invoice_engine
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Set up Python
        run: uv python install 3.12

      - name: Install dependencies
        run: uv sync --all-extras --dev

      - name: Run ruff
        run: uv run ruff check .

      - name: Run ty
        run: uv run ty check

      - name: Run tests
        env:
          DATABASE_URL: postgresql+asyncpg://uie_app:uie_secret@localhost:5432/universal_invoice_engine
        run: uv run pytest -v
